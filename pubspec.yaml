name: toytown
description: ToyTown — безпечний простір для обміну дитячими іграшками під наглядом батьків.
publish_to: 'none'
version: 1.0.16+26

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  flutter_map: ^7.0.2
  url_launcher: ^6.3.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  http: ^1.4.0
  flutter_lints: ^5.0.0
  shared_preferences_platform_interface: 2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/pets/
    - assets/places/ukraine.json
