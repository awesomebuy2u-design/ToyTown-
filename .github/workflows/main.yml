name: Build ToyTown APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.zip'
      - '*.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Find or extract ToyTown project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -not -path '*/.git/*' -print -quit)"
            if [ -z "$ZIP" ]; then
              echo "ERROR: No pubspec.yaml or project ZIP was found."
              exit 1
            fi

            EXTRACT_DIR="$RUNNER_TEMP/toytown-src"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$ZIP" -d "$EXTRACT_DIR"
            mapfile -t PROJECTS < <(find "$EXTRACT_DIR" -type f -name pubspec.yaml -not -path '*/.dart_tool/*' -printf '%h\n')
            if [ "${#PROJECTS[@]}" -ne 1 ]; then
              echo "ERROR: Expected one Flutter project in the ZIP; found ${#PROJECTS[@]}."
              printf '%s\n' "${PROJECTS[@]}"
              exit 1
            fi
            PROJECT_DIR="${PROJECTS[0]}"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ToyTown project: $PROJECT_DIR"
      - name: Apply branded ToyTown setup screen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("$PROJECT_DIR/lib/main.dart")
          source = p.read_text(encoding="utf-8")
          pattern = r"class SetupScreen extends StatelessWidget \\{.*?\\n\\}\\n\\nclass AuthGate"
          replacement = r'''class SetupScreen extends StatelessWidget {
            const SetupScreen({super.key});
            static const purple = Color(0xFF6C63D9);
            @override
            Widget build(BuildContext context) => Scaffold(
              body: Container(
                decoration: const BoxDecoration(
                  gradient: LinearGradient(
                    begin: Alignment.topLeft,
                    end: Alignment.bottomRight,
                    colors: [Color(0xFFFBF9FF), Color(0xFFEDE9FF), Color(0xFFF8F5FF)],
                  ),
                ),
                child: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.symmetric(horizontal: 28, vertical: 32),
                      child: ConstrainedBox(
                        constraints: const BoxConstraints(maxWidth: 420),
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            Stack(
                              alignment: Alignment.center,
                              children: [
                                Container(
                                  width: 190, height: 190,
                                  decoration: BoxDecoration(
                                    shape: BoxShape.circle,
                                    color: Colors.white.withValues(alpha: 0.72),
                                    boxShadow: [BoxShadow(color: purple.withValues(alpha: 0.12), blurRadius: 36, spreadRadius: 4)],
                                  ),
                                ),
                                const Icon(Icons.toys_rounded, size: 104, color: purple),
                                Positioned(top: 12, right: 12, child: Icon(Icons.star_rounded, size: 30, color: Color(0xFFFFC857))),
                                Positioned(bottom: 18, left: 8, child: Icon(Icons.toys_outlined, size: 28, color: Color(0xFFB7AEF5))),
                              ],
                            ),
                            const SizedBox(height: 24),
                            const Text('ToyTown', style: TextStyle(fontSize: 38, fontWeight: FontWeight.w800, letterSpacing: -1.2, color: Color(0xFF242232))),
                            const SizedBox(height: 10),
                            const Text(
                              'Іграшки знаходять нових друзів',
                              textAlign: TextAlign.center,
                              style: TextStyle(fontSize: 17, height: 1.4, color: Color(0xFF625D78), fontWeight: FontWeight.w500),
                            ),
                            const SizedBox(height: 28),
                            Container(
                              padding: const EdgeInsets.symmetric(horizontal: 18, vertical: 14),
                              decoration: BoxDecoration(color: Colors.white.withValues(alpha: 0.78), borderRadius: BorderRadius.circular(20), border: Border.all(color: purple.withValues(alpha: 0.12))),
                              child: const Row(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  Icon(Icons.favorite_rounded, color: Color(0xFF8B80E8), size: 20),
                                  SizedBox(width: 10),
                                  Flexible(child: Text('Більше радості — менше зайвих речей', textAlign: TextAlign.center, style: TextStyle(color: Color(0xFF514C68), fontSize: 14, fontWeight: FontWeight.w600))),
                                ],
                              ),
                            ),
                            const SizedBox(height: 28),
                            SizedBox(
                              width: double.infinity,
                              height: 56,
                              child: FilledButton(
                                style: FilledButton.styleFrom(backgroundColor: purple, foregroundColor: Colors.white, shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(18)), elevation: 4, shadowColor: purple.withValues(alpha: 0.28)),
                                onPressed: () => showDialog<void>(
                                  context: context,
                                  builder: (context) => AlertDialog(
                                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(24)),
                                    title: const Text('ToyTown скоро відкриється!'),
                                    content: const Text('Ми готуємо безпечний простір для обміну дитячими іграшками. Онлайн-магазин стане доступним після завершення налаштування.'),
                                    actions: [TextButton(onPressed: () => Navigator.pop(context), child: const Text('Зрозуміло'))],
                                  ),
                                ),
                                child: const Text('Почати', style: TextStyle(fontSize: 17, fontWeight: FontWeight.w700)),
                              ),
                            ),
                            const SizedBox(height: 16),
                            const Text('Маленькі речі — великі радощі', style: TextStyle(color: Color(0xFF817B99), fontSize: 13)),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              ),
            );
          }

          class AuthGate'''
          updated, count = re.subn(pattern, lambda _: replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"Could not locate SetupScreen for safe replacement (matches={count})")
          p.write_text(updated, encoding="utf-8")
          print("Applied ToyTown branded setup screen.")
          PY
      - name: Inspect ToyTown source structure
        shell: bash
        run: |
          set -euo pipefail
          echo "=== SOURCE FILES ==="
          find "$PROJECT_DIR" -maxdepth 5 -type f -not -path '*/.dart_tool/*' -not -path '*/build/*' -not -path '*/.git/*' | sort | head -250
          echo "=== PUBSPEC ==="
          sed -n '1,220p' "$PROJECT_DIR/pubspec.yaml"
          echo "=== APP ENTRY POINT ==="
          for f in "$PROJECT_DIR/lib/main.dart" "$PROJECT_DIR/lib/app.dart"; do
            if [ -f "$f" ]; then echo "--- $f"; sed -n '1,260p' "$f"; fi
          done
      - name: Generate Android platform files and configure Gradle
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties" ] || [ ! -f "$PROJECT_DIR/android/gradlew" ]; then
            flutter create --platforms=android --org ua.toytown "$PROJECT_DIR"
          fi
          WRAPPER="$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper properties were not generated."
            exit 1
          fi

          python3 - "$WRAPPER" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines() if path.exists() else []
          distribution = "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-all.zip"
          output = []
          replaced = False

          for line in lines:
              if line.startswith("distributionUrl="):
                  output.append(distribution)
                  replaced = True
              else:
                  output.append(line)
          if not replaced:
              output.append(distribution)

          path.write_text("\n".join(output) + "\n")
          PY

          chmod +x "$PROJECT_DIR/android/gradlew"

          # Update Android Gradle Plugin and Kotlin Gradle Plugin for Flutter 3.47+.
          python3 - "$PROJECT_DIR/android" <<'PY'
          from pathlib import Path
          import re
          import sys

          android = Path(sys.argv[1])
          files = [
              android / "settings.gradle",
              android / "settings.gradle.kts",
              android / "build.gradle",
              android / "build.gradle.kts",
          ]

          changed = []
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text()
              original = text
              text = re.sub(
                  r'((?:id\s*\(?\s*["\']com\.android\.(?:application|library)["\']\s*\)?\s*version\s*["\']))8\.\d+\.\d+(["\'])',
                  r'\g<1>8.9.1\2',
                  text,
              )
              text = re.sub(
                  r'((?:id\s*\(?\s*["\']org\.jetbrains\.kotlin\.(?:android|kotlin-android)["\']\s*\)?\s*version\s*["\']))[0-9.]+(["\'])',
                  r'\g<1>2.1.0\2',
                  text,
              )
              text = re.sub(
                  r'(com\.android\.tools\.build:gradle:)[0-9.]+',
                  r'\g<1>8.9.1',
                  text,
              )
              text = re.sub(
                  r'(kotlin_version\s*=\s*["\'])[0-9.]+(["\'])',
                  r'\g<1>2.1.0\2',
                  text,
              )
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          print("Updated Android build files:" if changed else "No version declarations changed.")
          for item in changed:
              print(item)
          for path in files:
              if path.exists():
                  for line in path.read_text().splitlines():
                      if any(key in line for key in ("com.android.application", "com.android.tools.build:gradle", "org.jetbrains.kotlin", "kotlin_version")):
                          print(f"{path.name}: {line.strip()}")
          PY
          
          echo "Configured Gradle:"
          grep '^distributionUrl=' "$WRAPPER"
          echo 'org.gradle.vfs.watch=false' >> "$PROJECT_DIR/android/gradle.properties"
          echo 'org.gradle.daemon=false' >> "$PROJECT_DIR/android/gradle.properties"
      - name: Install Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -uo pipefail
          set +e
          mkdir -p "$RUNNER_TEMP"

          echo "Starting Flutter release build..."
          flutter build apk --release --verbose --android-skip-build-dependency-validation \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            2>&1 | tee "$RUNNER_TEMP/flutter-build.log"
          FLUTTER_STATUS=${PIPESTATUS[0]}
          echo "Flutter exit code: $FLUTTER_STATUS"
          set -e

          APK="$(find "$PROJECT_DIR" -type f -iname '*.apk' \
            -not -path '*/.gradle/*' -not -path '*/build/intermediates/*' -print -quit)"

          if [ -z "$APK" ]; then
            echo "Flutter did not place an APK. Running Gradle assembleRelease directly..."
            cd "$PROJECT_DIR/android"
            ./gradlew --no-daemon --stacktrace :app:assembleRelease
            cd "$PROJECT_DIR"
            APK="$(find "$PROJECT_DIR" -type f -iname '*.apk' \
              -not -path '*/.gradle/*' -not -path '*/build/intermediates/*' -print -quit)"
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo "APK/Gradle output directories:"
            find "$PROJECT_DIR" -type d \( -name apk -o -name outputs -o -name flutter-apk \) -print
            echo "Gradle failure details:"
            grep -n -A12 -B5 -E 'FAILURE:|What went wrong:|Execution failed|Could not|error:' "$RUNNER_TEMP/flutter-build.log" | tail -160 || true
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/build/app/outputs/flutter-apk"
          cp "$APK" "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          echo "Release APK ready:"
          ls -lh "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
      - name: Sign APK for Android installation
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

          "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey --ks-pass pass:android \
            --key-pass pass:android --out "$APK.signed" "$APK"
          mv "$APK.signed" "$APK"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToyTown-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
