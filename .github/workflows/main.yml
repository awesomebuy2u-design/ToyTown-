name: Build ToyTown APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.zip'
      - '*.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Find or extract ToyTown project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -not -path '*/.git/*' -print -quit)"
            if [ -z "$ZIP" ]; then
              echo "ERROR: No pubspec.yaml or project ZIP was found."
              exit 1
            fi

            EXTRACT_DIR="$RUNNER_TEMP/toytown-src"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$ZIP" -d "$EXTRACT_DIR"
            mapfile -t PROJECTS < <(find "$EXTRACT_DIR" -type f -name pubspec.yaml -not -path '*/.dart_tool/*' -printf '%h\n')
            if [ "${#PROJECTS[@]}" -ne 1 ]; then
              echo "ERROR: Expected one Flutter project in the ZIP; found ${#PROJECTS[@]}."
              printf '%s\n' "${PROJECTS[@]}"
              exit 1
            fi
            PROJECT_DIR="${PROJECTS[0]}"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ToyTown project: $PROJECT_DIR"
      - name: Activate real ToyTown authentication screen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "lib" / "main.dart"
          source = p.read_text(encoding="utf-8")
          old = "home: hasBackend ? const AuthGate() : const SetupScreen(),"
          new = "home: const AuthGate(),"
          if old not in source:
              raise SystemExit("Expected app entry route was not found; refusing to build a placeholder APK.")
          p.write_text(source.replace(old, new, 1), encoding="utf-8")
          print("ToyTown now opens the real Supabase AuthGate.")
          PY
      - name: Inspect ToyTown source structure
        shell: bash
        run: |
          set -euo pipefail
          echo "=== SOURCE FILES ==="
          find "$PROJECT_DIR" -maxdepth 5 -type f -not -path '*/.dart_tool/*' -not -path '*/build/*' -not -path '*/.git/*' | sort | head -250
          echo "=== PUBSPEC ==="
          sed -n '1,220p' "$PROJECT_DIR/pubspec.yaml"
          echo "=== APP ENTRY POINT ==="
          for f in "$PROJECT_DIR/lib/main.dart" "$PROJECT_DIR/lib/app.dart"; do
            if [ -f "$f" ]; then echo "--- $f"; sed -n '1,260p' "$f"; fi
          done
      - name: Generate Android platform files and configure Gradle
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties" ] || [ ! -f "$PROJECT_DIR/android/gradlew" ]; then
            flutter create --platforms=android --org ua.toytown "$PROJECT_DIR"
          fi
          WRAPPER="$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper properties were not generated."
            exit 1
          fi

          python3 - "$WRAPPER" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines() if path.exists() else []
          distribution = "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-all.zip"
          output = []
          replaced = False

          for line in lines:
              if line.startswith("distributionUrl="):
                  output.append(distribution)
                  replaced = True
              else:
                  output.append(line)
          if not replaced:
              output.append(distribution)

          path.write_text("\n".join(output) + "\n")
          PY

          chmod +x "$PROJECT_DIR/android/gradlew"

          # Update Android Gradle Plugin and Kotlin Gradle Plugin for Flutter 3.47+.
          python3 - "$PROJECT_DIR/android" <<'PY'
          from pathlib import Path
          import re
          import sys

          android = Path(sys.argv[1])
          files = [
              android / "settings.gradle",
              android / "settings.gradle.kts",
              android / "build.gradle",
              android / "build.gradle.kts",
          ]

          changed = []
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text()
              original = text
              text = re.sub(
                  r'((?:id\s*\(?\s*["\']com\.android\.(?:application|library)["\']\s*\)?\s*version\s*["\']))8\.\d+\.\d+(["\'])',
                  r'\g<1>8.9.1\2',
                  text,
              )
              text = re.sub(
                  r'((?:id\s*\(?\s*["\']org\.jetbrains\.kotlin\.(?:android|kotlin-android)["\']\s*\)?\s*version\s*["\']))[0-9.]+(["\'])',
                  r'\g<1>2.1.0\2',
                  text,
              )
              text = re.sub(
                  r'(com\.android\.tools\.build:gradle:)[0-9.]+',
                  r'\g<1>8.9.1',
                  text,
              )
              text = re.sub(
                  r'(kotlin_version\s*=\s*["\'])[0-9.]+(["\'])',
                  r'\g<1>2.1.0\2',
                  text,
              )
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          print("Updated Android build files:" if changed else "No version declarations changed.")
          for item in changed:
              print(item)
          for path in files:
              if path.exists():
                  for line in path.read_text().splitlines():
                      if any(key in line for key in ("com.android.application", "com.android.tools.build:gradle", "org.jetbrains.kotlin", "kotlin_version")):
                          print(f"{path.name}: {line.strip()}")
          PY
          
          echo "Configured Gradle:"
          grep '^distributionUrl=' "$WRAPPER"
          echo 'org.gradle.vfs.watch=false' >> "$PROJECT_DIR/android/gradle.properties"
          echo 'org.gradle.daemon=false' >> "$PROJECT_DIR/android/gradle.properties"
      - name: Install Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_URL: https://nmiafhzpzhowzfgdtotb.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_4yQLa04u-ngF9qELHKbywg_0qyPXxcq
        shell: bash
        run: |
          set -euo pipefail
          # Never allow an APK from an earlier build to be packaged.
          rm -rf "$PROJECT_DIR/build" "$PROJECT_DIR/android/app/build"
          flutter clean
          flutter pub get

          echo "Building a fresh release APK..."
          if ! flutter build apk --release --android-skip-build-dependency-validation \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"; then
            echo "Flutter wrapper failed; retrying Gradle with the same Supabase Dart defines."
                        DART_DEFINE_URL="$(printf '%s' "SUPABASE_URL=$SUPABASE_URL" | base64 -w 0)"
            DART_DEFINE_KEY="$(printf '%s' "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" | base64 -w 0)"
            DART_DEFINES="$DART_DEFINE_URL,$DART_DEFINE_KEY"
            (cd "$PROJECT_DIR/android" && ./gradlew --no-daemon --stacktrace -Pdart-defines="$DART_DEFINES" :app:assembleRelease)
          fi

          CANDIDATES=(
            "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
            "$PROJECT_DIR/android/build/app/outputs/flutter-apk/app-release.apk"
            "$PROJECT_DIR/android/app/build/outputs/apk/release/app-release.apk"
            "$PROJECT_DIR/android/build/app/outputs/apk/release/app-release-unsigned.apk"
          )
          APK=""
          for candidate in "${CANDIDATES[@]}"; do
            if [ -s "$candidate" ]; then APK="$candidate"; break; fi
          done
          if [ -z "$APK" ]; then
            echo "ERROR: Fresh release APK was not generated."
            find "$PROJECT_DIR" -type f -iname '*.apk' -printf '%p %s bytes\\n' || true
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/build/app/outputs/flutter-apk"
          cp "$APK" "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          FINAL_APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$FINAL_APK"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt -o -name aapt2 | sort -V | tail -n 1)"
          if [ -z "$AAPT" ]; then echo "ERROR: Android aapt tool not found"; exit 1; fi
          "$AAPT" dump badging "$FINAL_APK" | head -n 5
          echo "Fresh release APK:"
          sha256sum "$FINAL_APK"
          ls -lh "$FINAL_APK"
      - name: Sign APK for Android installation
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

          "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey --ks-pass pass:android \
            --key-pass pass:android --out "$APK.signed" "$APK"
          mv "$APK.signed" "$APK"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToyTown-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
